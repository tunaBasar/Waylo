server:
  port: 8092

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

waylo:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_ACCESS_TTL_MS:900000}
    refresh-expiration: ${JWT_REFRESH_TTL_MS:604800000}
  verification:
    expiration-hours: 24
  reset:
    expiration-hours: 1

  cloud:
    openfeign:
      client:
        config:
          hotel-service:
            connect-timeout: 2000
            read-timeout: 2000
  internal:
    token: ${INTERNAL_API_TOKEN}
  # Service-to-service allowlist (service-auth-common): verified X-Service-Token callers per route group.
  # Derived from the Feign clients; any other /internal path fails closed. required: false = optional (user calls allowed too).
  service-auth:
    routes:
      - path: /internal/access
        callers: [hotel-service, bus-service, car-rental-service, package-booking-service, payment-service]
      - path: /internal/organizations
        callers: [hotel-service, bus-service, car-rental-service]
