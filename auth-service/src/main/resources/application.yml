server:
  port: 8092

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: waylo
    password: waylo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

waylo:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0S2V5V2F5bG9BdXRoU2VydmljZTIwMjRWZXJ5TG9uZ1NlY3JldEtleUZvckpXVA==}
    expiration: 86400000
    refresh-expiration: 604800000
  verification:
    expiration-hours: 24
  reset:
    expiration-hours: 1
