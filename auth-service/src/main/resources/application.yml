server:
  port: 8092

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: waylo
    password: waylo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

waylo:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_ACCESS_TTL_MS:900000}
    refresh-expiration: ${JWT_REFRESH_TTL_MS:604800000}
  verification:
    expiration-hours: 24
  reset:
    expiration-hours: 1

  cloud:
    openfeign:
      client:
        config:
          hotel-service:
            connect-timeout: 2000
            read-timeout: 2000
  internal:
    token: ${INTERNAL_API_TOKEN}
