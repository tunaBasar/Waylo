server:
  port: 8888

spring:
  application:
    name: config-service
  security:
    user:
      name: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD}
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
