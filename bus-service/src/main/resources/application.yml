server:
  port: 8096

spring:
  application:
    name: bus-service
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/bus_db
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

waylo:
  # Service-to-service allowlist (service-auth-common): verified X-Service-Token callers per route group.
  # Derived from the Feign clients; any other /internal path fails closed. required: false = optional (user calls allowed too).
  service-auth:
    routes:
      - path: /internal/bus-holds
        callers: [package-booking-service]
  bus:
    sales-enabled: ${BUS_SALES_ENABLED:false}
    hold-ttl-minutes: 15
    sales-close-minutes: 30
    documents-dir: ${BUS_DOCUMENTS_DIR:/data/bus-documents}
