server:
  port: 8088

spring:
  application:
    name: crm-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_db
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: crm-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

waylo:
  internal:
    token: ${INTERNAL_API_TOKEN:}
  crm:
    loyalty:
      points-per-try: ${CRM_LOYALTY_POINTS_PER_TRY:0}
      tier-silver-points: ${CRM_LOYALTY_TIER_SILVER:0}
      tier-gold-points: ${CRM_LOYALTY_TIER_GOLD:0}
      tier-platinum-points: ${CRM_LOYALTY_TIER_PLATINUM:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
