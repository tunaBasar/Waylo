server:
  port: 8761

spring:
  application:
    name: discovery-service
  security:
    user:
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASSWORD}
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    # F67: the read-only response cache (default 30s sync) served stale registries to clients.
    # Sync it from the live registry every 3s so new registrations and removals show up fast.
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
