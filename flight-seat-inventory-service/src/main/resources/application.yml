server:
  port: 8082

spring:
  application:
    name: flight-seat-inventory-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/flight_seat_inventory_db
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flight-seat-inventory-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

waylo:
  seat-hold:
    minutes: 15
  internal:
    token: ${INTERNAL_API_TOKEN}
  flight:
    offer-secret: ${FLIGHT_OFFER_SECRET:${INTERNAL_API_TOKEN}}
    offer-ttl-minutes: 10
    hold-ttl-minutes: 15
    sales-cutoff-minutes: 120
    paid-supplier:
      enabled: false
