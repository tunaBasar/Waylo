// Per-service identity for service-to-service calls: Ed25519-signed X-Service-Token (JWT, EdDSA).
// Plain library: every service picks it up through Spring Boot auto-configuration (same style as observability-common).
apply plugin: 'java-library'

bootJar { enabled = false }
jar { enabled = true }

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.slf4j:slf4j-api'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'io.github.openfeign:feign-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'io.github.openfeign:feign-core'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
