# Production overlay. Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Every secret becomes mandatory (no dev defaults) and the prod profile enables ProductionSecretsGuard.
# Check statically with scripts/check-prod-config.sh.
services:
  config-service:
    environment:
      # keep "native" (file-based config backend, see config-service application.yml); prod only adds the secrets guard
      SPRING_PROFILES_ACTIVE: native,prod
      CONFIG_PASSWORD: "${CONFIG_PASSWORD:?CONFIG_PASSWORD is required in production}"
  discovery-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: "optional:configserver:http://${CONFIG_USER:-config}:${CONFIG_PASSWORD:?CONFIG_PASSWORD is required in production}@config-service:8888"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:?EUREKA_PASSWORD is required in production}"
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: "optional:configserver:http://${CONFIG_USER:-config}:${CONFIG_PASSWORD:?CONFIG_PASSWORD is required in production}@config-service:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required in production}@discovery-service:8761/eureka/"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required in production}"
