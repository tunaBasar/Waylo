<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f4f4f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f9;padding:40px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
        <tr><td style="background:linear-gradient(135deg,#6750A4,#7F67BE);padding:32px 40px;text-align:center;">
          <h1 style="color:#ffffff;font-size:28px;margin:0;">&#9992; Waylo</h1>
        </td></tr>
        <tr><td style="padding:40px;">
          <h2 style="color:#1C1B1F;font-size:22px;margin:0 0 16px;">Merhaba <span th:text="${name}">Kullanici</span>,</h2>
          <p style="color:#49454F;font-size:15px;line-height:1.6;margin:0 0 16px;">Hesabiniz icin e-posta adresi degisikligi istendi. Degisiklik, yeni adrese gonderilen baglanti acilana kadar uygulanmaz.</p>
          <p style="color:#49454F;font-size:15px;line-height:1.6;margin:0;">Bu istegi siz yapmadiysaniz sifrenizi hemen degistirin ve bizimle iletisime gecin.</p>
        </td></tr>
        <tr><td style="background:#F7F2FA;padding:20px 40px;text-align:center;">
          <p style="color:#79747E;font-size:12px;margin:0;">&copy; <span th:text="${year}">2024</span> Waylo Travel. Tum haklari saklidir.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
