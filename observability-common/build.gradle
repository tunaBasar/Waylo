// Shared observability wiring (request id in MDC, Feign/Kafka propagation, log pattern, Prometheus registry).
// Plain library: every service picks it up through Spring Boot auto-configuration.
apply plugin: 'java-library'

bootJar { enabled = false }
jar { enabled = true }

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.slf4j:slf4j-api'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'org.springframework:spring-jdbc'
    compileOnly 'org.springframework:spring-tx'
    testImplementation 'org.springframework:spring-jdbc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.springframework.kafka:spring-kafka'
    compileOnly 'io.github.openfeign:feign-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'io.github.openfeign:feign-core'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
