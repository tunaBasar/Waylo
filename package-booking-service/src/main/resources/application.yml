server:
  port: 8085

spring:
  application:
    name: package-booking-service
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/package_booking_db
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: package-booking-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379

waylo:
  internal:
    token: ${INTERNAL_API_TOKEN}
  # Service-to-service allowlist (service-auth-common): verified X-Service-Token callers per route group.
  # Derived from the Feign clients; any other /internal path fails closed. required: false = optional (user calls allowed too).
  service-auth:
    routes:
      - path: /internal/orders/items
        callers: [hotel-service, checkin-service]
      - path: /internal/orders
        callers: [payment-service, notification-service]
      - path: /api/bookings
        callers: [package-booking-saga-orchestrator]
        required: false
  flight:
    # Platform seller organization that owns internal flight items (QR scan + payout). Required to sell flights.
    seller-organization-id: ${FLIGHT_SELLER_ORGANIZATION_ID:}
  voucher:
    # HMAC key for deriving voucher codes. Its own secret: anyone holding it could mint valid vouchers,
    # so it must not be shared with the service-to-service token. Required, min 32 chars.
    secret: ${VOUCHER_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
