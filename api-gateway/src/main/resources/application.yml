server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      timeout: 500ms
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"
  cloud:
    loadbalancer:
      cache:
        # F67: default 35s. 5s bounds how long a dead IP can be served from the LB instance cache.
        ttl: 5s
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          default-filters:
            # F67: a redeployed service gets a new IP, a connect-refused to the old one must not reach the customer.
            # GET only (idempotent). POST/PUT/PATCH/DELETE (payments, orders) are never retried.
            # retries=2: first retry hits a fresh/other instance. Backoff 100ms then 200ms (max 500ms) keeps added latency low.
            # exceptions: ConnectException covers netty's AbstractChannel$AnnotatedConnectException (its subclass).
            - name: Retry
              args:
                retries: 2
                methods: GET
                # Only connect failures. The factory defaults series to SERVER_ERROR, which would also retry every
                # 5xx answer of a healthy service (3x load on a failing endpoint); empty series/statuses turn that off.
                series:
                statuses:
                exceptions: java.net.ConnectException, io.netty.channel.AbstractChannel$AnnotatedConnectException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "${WAYLO_CORS_ORIGINS:http://localhost:3000,http://localhost:8081}"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowed-headers: "*"
                exposed-headers: X-Total-Count
                allow-credentials: true
                max-age: 3600
          routes:
            # --- Domain Services ---
            - id: flight-service
              uri: lb://flight-service
              predicates:
                - Path=/api/flights/**,/api/airports/**
            - id: flight-seat-inventory-service
              uri: lb://flight-seat-inventory-service
              predicates:
                - Path=/api/seat-inventory/**,/api/flight-offers,/api/flight-offers/**
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/quotes/**,/api/me/hotel-reviews,/api/me/reviewable-hotel-items,/api/partner/organizations/*/hotel-reviews,/api/partner/organizations/*/hotel-reviews/**,/api/admin/hotel-reviews,/api/admin/hotel-reviews/**,/api/admin/hotel-publications,/api/admin/hotel-publications/**,/api/admin/hotels/*/publication-status,/api/admin/hotel-media,/api/admin/hotel-media/**
            - id: car-rental-service
              uri: lb://car-rental-service
              predicates:
                - Path=/api/partner/organizations/*/branches,/api/partner/organizations/*/branches/**,/api/partner/organizations/*/vehicles,/api/partner/organizations/*/vehicles/**,/api/partner/organizations/*/rates,/api/partner/organizations/*/rates/**,/api/partner/organizations/*/one-way-routes,/api/partner/organizations/*/one-way-routes/**,/api/partner/organizations/*/documents,/api/partner/organizations/*/documents/**,/api/partner/organizations/*/rentals,/api/partner/organizations/*/rentals/**,/api/partner/organizations/*/status,/api/admin/car-documents,/api/admin/car-documents/**,/api/admin/car-vehicles,/api/admin/car-vehicles/**,/api/car-branches,/api/car-offers,/api/rentals/**
            - id: bus-service
              uri: lb://bus-service
              predicates:
                - Path=/api/bus-partner/**,/api/bus-trips,/api/bus-trips/**,/api/bus-terminals,/api/bus-sales-status,/api/bus-bookings/**,/api/admin/bus-documents,/api/admin/bus-documents/**,/api/admin/bus-vehicles,/api/admin/bus-terminals,/api/admin/bus-terminals/**
            - id: package-booking-service
              uri: lb://package-booking-service
              predicates:
                - Path=/api/bookings/**,/api/orders/**,/api/admin/orders,/api/partner/organizations/*/order-items,/api/partner/organizations/*/order-items/*/check-out,/api/partner/organizations/*/vouchers/redeem
            - id: pricing-service
              uri: lb://pricing-service
              predicates:
                - Path=/api/pricing-rules/**,/api/pricing/preview,/api/admin/campaigns,/api/admin/campaigns/**,/api/admin/promo-codes,/api/admin/promo-codes/**,/api/admin/tax-rates,/api/admin/tax-rates/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**,/api/partner/organizations/*/earnings,/api/admin/commission-rates,/api/admin/ledger,/api/admin/supplier-accounts,/api/admin/supplier-accounts/**,/api/partner/organizations/*/payouts,/api/partner/organizations/*/payouts/**,/api/partner/organizations/*/bank-account,/api/admin/payouts,/api/admin/payouts/**,/api/admin/bank-accounts,/api/admin/bank-accounts/**,/api/admin/organizations/*/payout-balance,/api/admin/organizations/*/payout-adjustments,/api/admin/payment-reconciliation
            - id: crm-service
              uri: lb://crm-service
              predicates:
                - Path=/api/customers/**,/api/me/support-cases,/api/me/support-cases/**,/api/partner/organizations/*/support-cases,/api/partner/organizations/*/support-cases/**,/api/admin/support-cases,/api/admin/support-cases/**,/api/support/**
            - id: checkin-service
              uri: lb://checkin-service
              predicates:
                - Path=/api/checkins/**,/api/admin/checkins
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**,/api/me/devices,/api/me/devices/**
            - id: kafka-dlt-crm
              uri: lb://crm-service
              predicates:
                - Path=/api/admin/kafka-dlt,/api/admin/kafka-dlt/replay
                - Query=service,crm-service
            - id: kafka-dlt-notification
              uri: lb://notification-service
              predicates:
                - Path=/api/admin/kafka-dlt,/api/admin/kafka-dlt/replay
                - Query=service,notification-service
            - id: kafka-dlt-flight-seat-inventory
              uri: lb://flight-seat-inventory-service
              predicates:
                - Path=/api/admin/kafka-dlt,/api/admin/kafka-dlt/replay
                - Query=service,flight-seat-inventory-service
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/organizations/**,/api/me/**,/api/admin/**
            - id: saga-orchestrator
              uri: lb://package-booking-saga-orchestrator
              predicates:
                - Path=/api/sagas/**

eureka:
  client:
    # F67: default 30s. Pull the registry every 5s so a recreated container's new IP is seen quickly.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:}@localhost:8761/eureka/

management:
  health:
    redis:
      enabled: false # rate limiting fails open, gateway health must not depend on Redis
  endpoints:
    web:
      exposure:
        include: health,info
        # 8080 is the public port: metrics must not be reachable here (shared config includes prometheus)
        exclude: prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.server: INFO

waylo:
  gateway:
    trust-forwarded-for: false
    login-per-minute: 10
    register-per-minute: 5
    forgot-password-per-minute: 3
    resend-verification-per-minute: 3
    refresh-per-minute: 30
    order-create-per-minute: 30
    voucher-redeem-per-minute: 30
  jwt:
    secret: ${JWT_SECRET}
