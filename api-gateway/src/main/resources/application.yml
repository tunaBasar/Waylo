server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      timeout: 500ms
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            # --- Domain Services ---
            - id: flight-service
              uri: lb://flight-service
              predicates:
                - Path=/api/flights/**,/api/airports/**
            - id: flight-seat-inventory-service
              uri: lb://flight-seat-inventory-service
              predicates:
                - Path=/api/seat-inventory/**
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**,/api/quotes/**
            - id: car-rental-service
              uri: lb://car-rental-service
              predicates:
                - Path=/api/vehicles/**,/api/rentals/**
            - id: package-booking-service
              uri: lb://package-booking-service
              predicates:
                - Path=/api/bookings/**,/api/orders/**,/api/partner/organizations/*/order-items
            - id: pricing-service
              uri: lb://pricing-service
              predicates:
                - Path=/api/pricing-rules/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            - id: crm-service
              uri: lb://crm-service
              predicates:
                - Path=/api/customers/**,/api/loyalty/**
            - id: checkin-service
              uri: lb://checkin-service
              predicates:
                - Path=/api/checkins/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/organizations/**,/api/me/**,/api/admin/**
            - id: saga-orchestrator
              uri: lb://package-booking-saga-orchestrator
              predicates:
                - Path=/api/sagas/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  health:
    redis:
      enabled: false # rate limiting fails open, gateway health must not depend on Redis
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.server: INFO

waylo:
  gateway:
    trust-forwarded-for: false
    login-per-minute: 10
    register-per-minute: 5
    forgot-password-per-minute: 3
    resend-verification-per-minute: 3
    refresh-per-minute: 30
  jwt:
    secret: ${JWT_SECRET}
