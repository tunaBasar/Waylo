  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col border-x border-outline-variant" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Compact Top Header -->

      <div class="flex items-center gap-sm">

      </div>
      <div class="flex items-center gap-xs">
        <span data-design-text-token="label-sm" class="font-label text-label-sm px-sm py-xs rounded-sm bg-primary-container text-on-primary-container">Misafir</span>
        <button type="button" class="min-h-[44px] px-sm font-label text-label-sm underline">Giriş yap</button>
      </div>
    </header>

    <!-- Segmented Mode Bar -->

      <button type="button" aria-pressed="true" class="min-h-[44px] rounded-md bg-primary text-on-primary font-label text-label-sm flex items-center justify-center gap-xs">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">hotel</span>
        <span data-design-text-token="label-sm">Otel</span>
      </button>
      <button type="button" aria-pressed="false" class="min-h-[44px] rounded-md bg-surface-container-low text-on-surface font-label text-label-sm flex items-center justify-center gap-xs">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">flight</span>
        <span data-design-text-token="label-sm">Uçuş</span>
      </button>
      <button type="button" aria-pressed="false" class="min-h-[44px] rounded-md bg-surface-container-low text-on-surface font-label text-label-sm flex items-center justify-center gap-xs">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">directions_car</span>
        <span data-design-text-token="label-sm">Araç</span>
      </button>
      <button type="button" aria-pressed="false" class="min-h-[44px] rounded-md bg-surface-container-low text-on-surface font-label text-label-sm flex items-center justify-center gap-xs">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">directions_bus</span>
        <span data-design-text-token="label-sm">Otobüs</span>
      </button>
    </nav>

        <h1 data-design-text-token="headline-lg" class="font-display text-headline-lg text-on-surface">Hızlı Otel Arama</h1>
        <span data-design-text-token="label-sm" class="font-label text-label-sm text-secondary">Üyeliksiz arama</span>
      </div>

        <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Şehir (isteğe bağlı)</span>
          <input type="text" value="İstanbul" placeholder="Şehir adı girin" class="min-h-[44px] px-md rounded-md bg-surface border border-outline-variant text-on-surface font-body text-body-lg">
        </label>

        <div class="grid grid-cols-2 gap-sm">
          <div class="p-sm rounded-md bg-surface border border-outline-variant flex flex-col">
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Giriş</span>
            <span data-design-text-token="mono-md" class="font-mono text-mono-md text-on-surface tabular-nums">04.12.2026</span>
          </div>
          <div class="p-sm rounded-md bg-surface border border-outline-variant flex flex-col">
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Çıkış</span>
            <span data-design-text-token="mono-md" class="font-mono text-mono-md text-on-surface tabular-nums">06.12.2026</span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-sm">
          <button type="button" class="min-h-[44px] px-sm rounded-md bg-surface border border-outline-variant text-left">
            <span data-design-text-token="label-sm" class="block font-label text-label-sm text-on-surface-variant">Oda</span>
            <span data-design-text-token="body-md" class="font-body text-body-md text-on-surface tabular-nums">1 oda</span>

            <span data-design-text-token="label-sm" class="block font-label text-label-sm text-on-surface-variant">Yetişkin</span>
            <span data-design-text-token="body-md" class="font-body text-body-md text-on-surface tabular-nums">2 yetişkin</span>
          </button>
          <button type="button" class="min-h-[44px] px-sm rounded-md bg-surface border border-outline-variant text-left">
            <span data-design-text-token="label-sm" class="block font-label text-label-sm text-on-surface-variant">Çocuk</span>
            <span data-design-text-token="body-md" class="font-body text-body-md text-on-surface tabular-nums">1 çocuk</span>
          </button>
        </div>

        <div class="p-sm rounded-md bg-surface-container-low flex items-center justify-between">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface">1. Çocuk yaşı: 6 yaş</span>
          <div class="flex items-center gap-xs">
            <button type="button" aria-label="Yaşı azalt" class="min-h-[44px] min-w-[44px] rounded-md bg-surface-container-lowest border border-outline-variant flex items-center justify-center">-</button>
            <button type="button" aria-label="Yaşı artır" class="min-h-[44px] min-w-[44px] rounded-md bg-surface-container-lowest border border-outline-variant flex items-center justify-center">+</button>
          </div>
        </div>

        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full inline-flex items-center justify-center min-h-[44px] px-lg rounded-md bg-primary text-on-primary font-label">
          <span data-design-text-token="label-lg" class="text-label-lg">Ara</span>
        </button>
      </section>

      <!-- Quick Summary Card -->
      <section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md flex items-center justify-between">
        <div>
          <p data-design-text-token="title-md" class="font-title text-title-md text-on-surface">Aktif Sepet</p>
          <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">3 ürün · Tek QR ödeme</p>
        </div>
        <span data-design-text-token="mono-md" class="font-mono text-mono-md text-primary tabular-nums">₺7.220,00</span>

        <span>Siparişler</span>
