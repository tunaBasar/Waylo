<body class="bg-surface text-on-surface antialiased">
  <div class="min-h-[884px] max-w-[390px] mx-auto bg-surface flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

    <header class="sticky top-0 z-20 bg-surface px-lg py-md flex items-center gap-md">
      <button type="button" aria-label="Geri dön" class="inline-flex items-center justify-center min-h-[44px] min-w-[44px] rounded-full bg-surface-container-high text-on-surface shrink-0">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0 flex-1">
        <h1 data-design-text-token="headline-md" class="font-display text-headline-md text-on-surface">İstanbul → Ankara</h1>
        <p data-design-text-token="mono-sm" class="font-mono text-mono-sm text-on-surface-variant tabular-nums">
          Waylo Otobüs İşletmesi · 22:30 - 05:00 · ₺750,00
        </p>
      </div>
    </header>

    <main class="flex-1 px-lg pb-lg flex flex-col gap-md">

      <!-- Legend -->
      <div class="bg-surface-container rounded-lg p-md grid grid-cols-4 gap-xs text-center">
        <div class="flex flex-col items-center gap-xs">
          <span class="w-6 h-6 rounded-sm border border-outline bg-surface-container-low text-[11px] font-mono flex items-center justify-center">1</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Boş</span>
        </div>
        <div class="flex flex-col items-center gap-xs">
          <span class="w-6 h-6 rounded-sm bg-primary text-on-primary text-[11px] font-mono flex items-center justify-center">✓</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Seçili</span>
        </div>
        <div class="flex flex-col items-center gap-xs">
          <span class="w-6 h-6 rounded-sm bg-tertiary-container text-on-tertiary-container text-[11px] font-label flex items-center justify-center">K</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Kadın</span>
        </div>
        <div class="flex flex-col items-center gap-xs">
          <span class="w-6 h-6 rounded-sm bg-secondary-container text-on-secondary-container text-[11px] font-label flex items-center justify-center">E</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Erkek</span>
        </div>
      </div>

      <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant px-xs">
        Yabancı bir karşı cins yolcunun yanına oturulamaz. En fazla 5 koltuk seçilebilir.
      </p>

      <!-- 2+2 48 seats -->
      <section class="bg-surface-container rounded-xl p-md">
        <div id="ge-seat-grid" class="flex flex-col gap-xs"></div>
      </section>

      <!-- Passenger -->
      <section class="bg-surface-container rounded-lg p-lg flex flex-col gap-sm">
        <div class="flex items-center justify-between">
          <span data-design-text-token="title-md" class="font-title text-title-md text-primary">Koltuk 23 (1 / 5)</span>
          <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-on-surface tabular-nums">₺750,00</span>
        </div>
        <input type="text" value="Emre Demir" aria-label="Yolcu adı soyadı" class="min-h-[44px] px-md rounded-md bg-surface-container-low border border-outline-variant text-on-surface font-body text-body-lg">
        <div class="grid grid-cols-2 gap-sm">
          <button type="button" aria-pressed="false" class="min-h-[44px] rounded-full bg-surface-container-low border border-outline-variant text-on-surface font-label text-label-lg">Kadın</button>
          <button type="button" aria-pressed="true" class="min-h-[44px] rounded-full bg-secondary-container text-on-secondary-container font-label text-label-lg">Erkek</button>
        </div>
      </section>

    </main>

    <footer class="sticky bottom-0 z-20 bg-surface-container-high px-lg py-md flex items-center justify-between">
      <div>
        <span data-design-text-token="label-sm" class="block font-label text-label-sm text-on-surface-variant">Toplam (1 koltuk)</span>
        <span data-design-text-token="headline-md" class="font-display text-headline-md text-on-surface tabular-nums">₺750,00</span>
      </div>
      <button type="button" class="min-h-[44px] px-xl rounded-full bg-primary text-on-primary font-label text-label-lg">Sepete ekle</button>
    </footer>

  </div>
  <script>
    (function () {
      const takenK = new Set([1, 2, 5, 9, 13, 14, 29, 30]);
      const takenE = new Set([3, 4, 7, 11, 19, 20, 27, 35]);
      const selected = new Set([23]);
      const grid = document.getElementById('ge-seat-grid');
      for (let r = 0; r < 12; r++) {
        const row = document.createElement('div');
        row.className = 'grid grid-cols-[1fr_1fr_18px_1fr_1fr] gap-xs items-center';
        const base = r * 4 + 1;
        [base, base + 1, null, base + 2, base + 3].forEach((num) => {
          if (num === null) {
            const sp = document.createElement('div');
            sp.className = 'text-center font-mono text-[11px] text-on-surface-variant';
            sp.textContent = r + 1;
            row.appendChild(sp);
            return;
          }
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'min-h-[44px] rounded-sm font-mono text-mono-sm flex flex-col items-center justify-center ';
          if (selected.has(num)) {
            btn.className += 'bg-primary text-on-primary font-bold';
            btn.innerHTML = '<span>' + num + '</span><span class="text-[10px]">✓</span>';
          } else if (takenK.has(num)) {
            btn.disabled = true;
            btn.className += 'bg-tertiary-container text-on-tertiary-container';
            btn.innerHTML = '<span>' + num + '</span><span class="text-[10px]">K</span>';
          } else if (takenE.has(num)) {
            btn.disabled = true;
            btn.className += 'bg-secondary-container text-on-secondary-container';
            btn.innerHTML = '<span>' + num + '</span><span class="text-[10px]">E</span>';
          } else {
            btn.className += 'bg-surface-container-low border border-outline-variant text-on-surface';
            btn.textContent = num;
          }
          row.appendChild(btn);
        });
        grid.appendChild(row);
      }
    })();
  </script>
