      WAYLO_SERVICE_KEYS_PACKAGE_BOOKING_SERVICE: "${WAYLO_SERVICE_KEYS_PACKAGE_BOOKING_SERVICE:-}"
      WAYLO_SERVICE_KEYS_PAYMENT_SERVICE: "${WAYLO_SERVICE_KEYS_PAYMENT_SERVICE:-}"
      WAYLO_SERVICE_KEYS_CRM_SERVICE: "${WAYLO_SERVICE_KEYS_CRM_SERVICE:-}"
      # notification-service reads partner owner e-mails (GET /internal/organizations/{id}/contacts, 2026-11-26)
      WAYLO_SERVICE_KEYS_NOTIFICATION_SERVICE: "${WAYLO_SERVICE_KEYS_NOTIFICATION_SERVICE:-}"
      WAYLO_BOOTSTRAP_ADMIN_EMAIL: "${WAYLO_BOOTSTRAP_ADMIN_EMAIL:-}"
      WAYLO_BOOTSTRAP_ADMIN_PASSWORD: "${WAYLO_BOOTSTRAP_ADMIN_PASSWORD:-}"
    depends_on:
