      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_db"
      SPRING_DATASOURCE_USERNAME: waylo
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Signed service identity (service-auth-common); keys from scripts/gen-service-keys.py (signed tokens only: no key = no service calls)
      WAYLO_SERVICE_PRIVATE_KEY: "${WAYLO_SERVICE_PRIVATE_KEY_AUTH_SERVICE:-}"
