services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: waylo-postgres
    environment:
      POSTGRES_USER: waylo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_MULTIPLE_DATABASES: >-
        flight_db,flight_seat_inventory_db,hotel_db,car_rental_db,
        package_booking_db,pricing_db,payment_db,crm_db,checkin_db,
        notification_db,saga_db,auth_db,bus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "127.0.0.1:5432:5432"
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waylo"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: waylo-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 'WayloKafkaCluster0001'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: waylo-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: waylo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@waylo.com
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M

  # ──────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────

  config-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: config-service
    container_name: waylo-config-service
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m"
      # DEV defaults only: set real values in .env for any shared/prod deployment
      CONFIG_USER: "${CONFIG_USER:-config}"
      CONFIG_PASSWORD: "${CONFIG_PASSWORD:-dev-config-password}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-service
    container_name: waylo-discovery-service
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://${CONFIG_USER:-config}:${CONFIG_PASSWORD:-dev-config-password}@config-service:8888"
      # DEV defaults only: set real values in .env for any shared/prod deployment
      EUREKA_USER: "${EUREKA_USER:-eureka}"
      EUREKA_PASSWORD: "${EUREKA_PASSWORD:-dev-eureka-password}"
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: waylo-api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://${CONFIG_USER:-config}:${CONFIG_PASSWORD:-dev-config-password}@config-service:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-dev-eureka-password}@discovery-service:8761/eureka/"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      SPRING_DATA_REDIS_HOST: redis
      WAYLO_CORS_ORIGINS: "${WAYLO_CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}"
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

