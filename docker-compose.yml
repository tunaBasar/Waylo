      dockerfile: Dockerfile
      args:
        SERVICE: checkin-service
    container_name: waylo-checkin-service
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://${CONFIG_USER:-config}:${CONFIG_PASSWORD:-dev-config-password}@config-service:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-dev-eureka-password}@discovery-service:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/checkin_db"
      SPRING_DATASOURCE_USERNAME: waylo
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      SPRING_DATA_REDIS_HOST: redis
      # Signed service identity (service-auth-common); keys from scripts/gen-service-keys.py (signed tokens only: no key = no service calls)
      WAYLO_SERVICE_PRIVATE_KEY: "${WAYLO_SERVICE_PRIVATE_KEY_CHECKIN_SERVICE:-}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

