server:
  port: 8084

spring:
  application:
    name: car-rental-service
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/car_rental_db
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: car-rental-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: localhost
      port: 6379
  # F77: fail fast when auth-service is down or restarting (default connect timeout is 10 s; the admin car list waited
  # 15 s). Same values as hotel-service -> auth-service.
  cloud:
    openfeign:
      client:
        config:
          auth-service:
            connect-timeout: 2000
            read-timeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

waylo:
  # Service-to-service allowlist (service-auth-common): verified X-Service-Token callers per route group.
  # Derived from the Feign clients; any other /internal path fails closed. required: false = optional (user calls allowed too).
  service-auth:
    routes:
      - path: /internal/car-holds
        callers: [package-booking-service]
  car:
    individual-partners-enabled: ${CAR_INDIVIDUAL_PARTNERS_ENABLED:false}
    hold-ttl-minutes: 15
    documents-dir: ${CAR_DOCUMENTS_DIR:/data/car-documents}
