server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: hotel-service
  config:
    import: "optional:configserver:http://${CONFIG_USER:config}:${CONFIG_PASSWORD:}@localhost:8888"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_db}
    username: ${DB_USERNAME:waylo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: hotel-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    openfeign:
      client:
        config:
          auth-service:
            connect-timeout: 2000
            read-timeout: 2000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:}@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

waylo:
  # Service-to-service allowlist (service-auth-common): verified X-Service-Token callers per route group.
  # Derived from the Feign clients; any other /internal path fails closed. required: false = optional (user calls allowed too).
  service-auth:
    routes:
      - path: /internal/hotels
        callers: [auth-service]
      - path: /internal/hotel-holds
        callers: [package-booking-service]
